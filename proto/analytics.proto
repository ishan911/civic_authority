// M4: Implemented when building the analytics microservice.
//
// To compile (once protoc is installed):
//   protoc --go_out=../pb --go_out=paths=source_relative:../pb \
//          --go-grpc_out=../pb --go-grpc_out=paths=source_relative:../pb \
//          analytics.proto

syntax = "proto3";

package analytics;

option go_package = "github.com/ishanjayman/civic-authority/pb";

// AnalyticsService provides read-only aggregate stats.
// The gateway calls this from GET /api/analytics/summary.
service AnalyticsService {
  rpc GetSummary (SummaryRequest) returns (SummaryReply);
}

// TODO (M4): Define SummaryRequest and SummaryReply messages.
